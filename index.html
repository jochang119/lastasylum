<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Last Asylum 좌표 조회</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f1115;
      color: #e6e8ec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1d24;
      border: 1px solid #2a2f3a;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }
    .sub {
      font-size: 0.85rem;
      color: #8b93a7;
      text-align: center;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #8b93a7;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2a2f3a;
      background: #12151b;
      color: #e6e8ec;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: #4f6ef7;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #4f6ef7;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) {
      background: #3b5bdb;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .result {
      margin-top: 28px;
      text-align: center;
      min-height: 60px;
    }
    .coords {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #7dd3fc;
    }
    .error {
      color: #f87171;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .info {
      color: #8b93a7;
      font-size: 0.85rem;
    }
    .nick {
      font-size: 0.9rem;
      color: #a0a8b8;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Last Asylum 좌표 조회</h1>
    <p class="sub">서버 번호 + 닉네임으로 좌표만 확인</p>

    <label for="server">서버 번호</label>
    <input type="number" id="server" placeholder="예: 1" min="1" />

    <label for="nick">닉네임</label>
    <input type="text" id="nick" placeholder="예: DrLOL" autocomplete="off" />

    <button id="btn" onclick="lookup()">조회하기</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    const serverInput = document.getElementById('server');
    const nickInput = document.getElementById('nick');
    const btn = document.getElementById('btn');
    const result = document.getElementById('result');

    // Enter 키로도 조회
    [serverInput, nickInput].forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') lookup();
      });
    });

    async function lookup() {
      const server = serverInput.value.trim();
      const nick = nickInput.value.trim();

      if (!server || !nick) {
        result.innerHTML = '<div class="error">서버 번호와 닉네임을 모두 입력해주세요.</div>';
        return;
      }

      btn.disabled = true;
      btn.textContent = '조회 중...';
      result.innerHTML = '<div class="info">불러오는 중...</div>';

      try {
        const res = await fetch(`/api/player?server=${encodeURIComponent(server)}&name=${encodeURIComponent(nick)}`);
        const data = await res.json();

        if (!res.ok) {
          let msg = data.error || '알 수 없는 오류';
          if (res.status === 404) msg = '플레이어를 찾을 수 없습니다.';
          if (res.status === 409) msg = '같은 닉네임이 여러 명 있습니다. 서버 번호를 확인해주세요.';
          if (res.status === 429) msg = '일일 요청 한도를 초과했습니다.';
          if (res.status === 401) msg = 'API 키가 유효하지 않습니다.';
          result.innerHTML = `<div class="error">${msg}</div>`;
          return;
        }

        const x = data.x;
        const y = data.y;
        const name = data.nick || nick;

        result.innerHTML = `
          <div class="nick">${name}</div>
          <div class="coords">${x}, ${y}</div>
        `;
      } catch (err) {
        result.innerHTML = '<div class="error">네트워크 오류가 발생했습니다.</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = '조회하기';
      }
    }
  </script>
</body>
</html>
